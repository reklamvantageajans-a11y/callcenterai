<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Arama</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: Inter, system-ui, sans-serif; background:#f7f8fa; color:#1a1d23; min-height:100vh; padding:24px; }
    .wrap { max-width:1100px; margin:0 auto; display:grid; gap:20px; grid-template-columns: minmax(280px, 340px) 1fr; }
    @media (max-width:860px) { .wrap { grid-template-columns:1fr; } }
    .card { background:#fff; border:1px solid #e8eaed; border-radius:16px; padding:22px; }
    h1 { font-size:18px; font-weight:650; margin-bottom:4px; }
    .sub { font-size:13px; color:#8a909d; margin-bottom:16px; }
    label { display:block; font-size:12px; font-weight:600; color:#40444f; margin:12px 0 6px; }
    input, select { width:100%; border:1px solid #e8eaed; border-radius:10px; padding:11px 12px; font:inherit; font-size:14px; }
    button.primary { width:100%; margin-top:16px; border:none; border-radius:10px; padding:12px; background:#0f7c4b; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button.primary:disabled { opacity:.55; }
    #msg { margin-top:12px; font-size:13px; min-height:18px; }
    .ok { color:#0f7c4b; } .err { color:#c0392b; }
    .call { border:1px solid #e8eaed; border-radius:12px; padding:12px; margin-bottom:10px; cursor:pointer; }
    .call:hover, .call.on { border-color:#1a3560; background:#f8fafc; }
    .num { font-family: ui-monospace, monospace; font-size:13px; font-weight:600; }
    .meta { font-size:12px; color:#8a909d; margin-top:4px; }
    .turn { margin:8px 0; padding:10px 12px; border-radius:10px; font-size:13.5px; line-height:1.45; }
    .turn.agent { background:#f1f5f9; }
    .turn.user { background:#ecfdf5; }
    .who { font-size:11px; font-weight:600; color:#64748b; margin-bottom:4px; }
    audio { width:100%; margin-top:10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Dış arama</h1>
      <p class="sub">Numarayı girin, ajan arar. Kayıt ve konuşma metni sağda görünür.</p>
      <label for="secret">Şifre (CALL_SECRET)</label>
      <input id="secret" type="password" autocomplete="current-password">
      <label for="to">Aranacak numara</label>
      <input id="to" type="tel" placeholder="+49..." inputmode="tel">
      <label for="lang">Dil</label>
      <select id="lang">
        <option value="de">Almanca</option>
        <option value="tr">Türkçe</option>
      </select>
      <button class="primary" id="btn" onclick="placeCall()">Ara</button>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h1>Kayıtlar</h1>
      <p class="sub">İki tarafın söyledikleri. Görüşme bitince yenileyin.</p>
      <div id="list"></div>
      <div id="detail"></div>
    </div>
  </div>
  <script>
    const secretEl = document.getElementById('secret');
    secretEl.value = localStorage.getItem('call_secret') || '';
    secretEl.addEventListener('change', () => localStorage.setItem('call_secret', secretEl.value.trim()));

    function secret() { return secretEl.value.trim(); }
    function headers() { return { 'Content-Type': 'application/json', 'x-call-secret': secret() }; }

    async function placeCall() {
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      let to = document.getElementById('to').value.replace(/[\s()-]/g, '');
      const lang = document.getElementById('lang').value;
      msg.className = ''; msg.textContent = '';
      if (!secret() || !to) { msg.className = 'err'; msg.textContent = 'Şifre ve numara gerekli.'; return; }
      if (!to.startsWith('+')) to = '+' + to.replace(/^00/, '');
      localStorage.setItem('call_secret', secret());
      btn.disabled = true; btn.textContent = 'Aranıyor...';
      try {
        const res = await fetch('/twilio/call', { method:'POST', headers: headers(), body: JSON.stringify({ to, lang }) });
        const data = await res.json();
        if (!res.ok) {
          msg.className = 'err';
          msg.textContent = data.error === 'unauthorized' ? 'Şifre hatalı.' : (data.error || 'Arama başlatılamadı.');
        } else {
          msg.className = 'ok';
          msg.textContent = 'Arama başladı.';
          loadCalls();
        }
      } catch (e) { msg.className = 'err'; msg.textContent = 'Bağlantı hatası.'; }
      btn.disabled = false; btn.textContent = 'Ara';
    }

    let selected = null;
    async function loadCalls() {
      if (!secret()) return;
      const res = await fetch('/api/calls', { headers: headers() });
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = (data.calls || []).map(c => `
        <div class="call ${selected===c.id?'on':''}" onclick="showCall('${c.id}')">
          <div class="num">${c.phoneNumber || c.id}</div>
          <div class="meta">${c.direction || ''} · ${c.lang || ''} · ${(c.transcriptPreview || '').slice(0,80)}</div>
        </div>`).join('') || '<p class="sub">Henüz kayıt yok.</p>';
    }

    async function showCall(id) {
      selected = id;
      const res = await fetch('/api/calls/' + id, { headers: headers() });
      if (!res.ok) return;
      const c = await res.json();
      loadCalls();
      const turns = (c.transcript || []).map(t => `
        <div class="turn ${t.role}">
          <div class="who">${t.role === 'agent' ? 'Ajan' : 'Müşteri'}</div>
          <div>${(t.text || '').replace(/</g,'')}</div>
        </div>`).join('') || '<p class="sub">Konuşma metni henüz yok.</p>';
      const rec = c.twilioRecordingUrl
        ? `<audio controls src="/api/calls/${c.id}/recording?secret=${encodeURIComponent(secret())}"></audio>`
        : '';
      document.getElementById('detail').innerHTML = `<hr style="border:none;border-top:1px solid #e8eaed;margin:16px 0">${turns}${rec}`;
    }

    loadCalls();
    setInterval(loadCalls, 8000);
  </script>
</body>
</html>
