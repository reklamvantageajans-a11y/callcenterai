<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sigorta Danışmanı</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1e1e2a;
      --text: #e4e4ed;
      --muted: #6b6b80;
      --accent: #6c63ff;
      --accent2: #00d4aa;
      --glow: rgba(108,99,255,0.25);
    }
    body {
      font-family:'Inter',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
    }

    /* ── HEADER ── */
    header {
      padding:16px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:1px solid var(--border);
      flex-shrink:0;
    }
    header .brand {
      display:flex; align-items:center; gap:10px;
    }
    header .brand .dot {
      width:10px; height:10px; border-radius:50%;
      background:var(--accent2);
      box-shadow:0 0 8px var(--accent2);
      animation:pulse-dot 2s ease infinite;
    }
    @keyframes pulse-dot {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.5;transform:scale(.8)}
    }
    header .brand h1 {
      font-size:15px; font-weight:600; letter-spacing:.5px;
    }
    #status-text {
      font-size:12px; color:var(--muted); font-weight:400;
      padding:4px 12px;
      border:1px solid var(--border);
      border-radius:20px;
      transition:all .3s;
    }
    #status-text.active { color:var(--accent2); border-color:var(--accent2); }
    #status-text.speaking { color:#ff6b6b; border-color:#ff6b6b; }
    #status-text.thinking { color:#ffd93d; border-color:#ffd93d; }

    /* ── CENTER ── */
    main {
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      position:relative;
      overflow:hidden;
    }

    /* ── ORB ── */
    #orb-wrap {
      position:relative;
      width:220px; height:220px;
      cursor:pointer;
    }
    #orb {
      width:100%; height:100%;
      border-radius:50%;
      background:radial-gradient(circle at 35% 35%, #8b7fff, #6c63ff 40%, #4a3fcf 70%, #2d1f9e);
      box-shadow:
        0 0 60px var(--glow),
        0 0 120px rgba(108,99,255,0.1),
        inset 0 0 40px rgba(255,255,255,0.05);
      transition:transform .6s cubic-bezier(.23,1,.32,1), box-shadow .6s;
      animation:orb-breathe 4s ease-in-out infinite;
    }
    @keyframes orb-breathe {
      0%,100%{transform:scale(1)}
      50%{transform:scale(1.03)}
    }
    #orb.listening {
      animation:orb-listen .8s ease-in-out infinite alternate;
      box-shadow:0 0 80px rgba(0,212,170,.3), 0 0 160px rgba(0,212,170,.1);
      background:radial-gradient(circle at 35% 35%, #00f0c0, #00d4aa 40%, #00a888 70%, #007766);
    }
    @keyframes orb-listen {
      0%{transform:scale(1)}
      100%{transform:scale(1.08)}
    }
    #orb.speaking {
      animation:orb-speak .4s ease-in-out infinite alternate;
      box-shadow:0 0 80px rgba(108,99,255,.4), 0 0 160px rgba(108,99,255,.15);
    }
    @keyframes orb-speak {
      0%{transform:scale(1)}
      100%{transform:scale(1.12)}
    }
    #orb.thinking {
      animation:orb-think 1.5s ease-in-out infinite;
      box-shadow:0 0 80px rgba(255,217,61,.25);
      background:radial-gradient(circle at 35% 35%, #ffe680, #ffd93d 40%, #e6b800 70%, #b38f00);
    }
    @keyframes orb-think {
      0%,100%{transform:scale(1) rotate(0deg)}
      50%{transform:scale(1.05) rotate(3deg)}
    }
    #orb-label {
      position:absolute;
      bottom:-36px; left:0; right:0;
      text-align:center;
      font-size:13px; color:var(--muted);
      font-weight:500;
      letter-spacing:1px;
      text-transform:uppercase;
    }

    /* ── TRANSCRIPT ── */
    #transcript {
      position:absolute;
      bottom:0; left:0; right:0;
      max-height:180px;
      overflow-y:auto;
      padding:20px 32px;
      mask-image:linear-gradient(transparent 0%, black 30%);
      -webkit-mask-image:linear-gradient(transparent 0%, black 30%);
    }
    #transcript::-webkit-scrollbar { width:3px; }
    #transcript::-webkit-scrollbar-track { background:transparent; }
    #transcript::-webkit-scrollbar-thumb { background:var(--border); border-radius:4px; }
    .msg {
      margin-bottom:8px;
      font-size:14px;
      line-height:1.5;
      animation:msg-in .3s ease;
    }
    @keyframes msg-in {
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    .msg.ai { color:var(--text); }
    .msg.user { color:var(--accent2); }

    /* ── BOTTOM BAR ── */
    footer {
      padding:16px 24px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      border-top:1px solid var(--border);
      flex-shrink:0;
    }
    .btn {
      width:52px; height:52px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:all .2s;
      position:relative;
    }
    .btn svg { width:22px; height:22px; }
    .btn:hover { transform:scale(1.1); }
    .btn:active { transform:scale(.95); }

    #btn-call {
      width:64px; height:64px;
      background:linear-gradient(135deg, #00d4aa, #00b894);
      box-shadow:0 0 20px rgba(0,212,170,.3);
    }
    #btn-call svg { fill:#fff; width:26px; height:26px; }
    #btn-call.active {
      background:linear-gradient(135deg, #ff6b6b, #ee5a24);
      box-shadow:0 0 20px rgba(255,107,107,.3);
    }
    #btn-mute {
      background:var(--surface);
      border:1px solid var(--border);
    }
    #btn-mute svg { fill:var(--text); }
    #btn-mute.muted {
      background:rgba(255,107,107,.15);
      border-color:#ff6b6b;
    }
    #btn-mute.muted svg { fill:#ff6b6b; }

    /* ── RING ANIMATION ── */
    .ring {
      position:absolute;
      width:100%; height:100%;
      border-radius:50%;
      border:2px solid var(--accent);
      opacity:0;
      pointer-events:none;
    }
    #orb.speaking .ring {
      animation:ring-out 1.5s ease-out infinite;
    }
    #orb.listening .ring {
      border-color:var(--accent2);
      animation:ring-out 2s ease-out infinite;
    }
    @keyframes ring-out {
      0%{transform:scale(1);opacity:.6}
      100%{transform:scale(1.8);opacity:0}
    }

    /* ── PING ── */
    #ping {
      position:fixed;
      top:16px; right:24px;
      font-size:11px;
      color:var(--muted);
      font-variant-numeric:tabular-nums;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="dot" id="conn-dot"></div>
      <h1>Sigorta Danışmanı</h1>
    </div>
    <span id="status-text">Bağlantı bekleniyor</span>
  </header>

  <main>
    <div id="orb-wrap" onclick="toggleCall()">
      <div id="orb">
        <div class="ring"></div>
        <div class="ring" style="animation-delay:.5s"></div>
      </div>
      <div id="orb-label">Başlamak için dokunun</div>
    </div>
    <div id="transcript"></div>
  </main>

  <footer>
    <button class="btn" id="btn-mute" onclick="toggleMute()" style="display:none">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 0014 0h-2zm-5 9a1 1 0 01-1-1h2a1 1 0 01-1 1z"/></svg>
    </button>
    <button class="btn" id="btn-call" onclick="toggleCall()">
      <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.05 15.05 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.36 11.36 0 003.53.56 1 1 0 011 1V20a1 1 0 01-1 1A17 17 0 013 4a1 1 0 011-1h3.5a1 1 0 011 1 11.36 11.36 0 00.56 3.53 1 1 0 01-.27 1.11z"/></svg>
    </button>
  </footer>
  <div id="ping"></div>
  <script src="/static/app.js"></script>
</body>
</html>
